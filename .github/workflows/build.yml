name: Build Electron App

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build React
        run: npm run build:react
      
      - name: Remove source maps
        run: del /s /q build\*.map & rmdir /s /q build\node_modules 2>nul || exit /b 0
      
      - name: Build Electron
        run: npm run build:electron
      
      - name: Prune dev dependencies for package
        run: npm prune --omit=dev
      
      - name: Clean node_modules cache
        run: rmdir /s /q node_modules\.cache 2>nul || exit /b 0
      
      - name: Package for Windows
        run: npm run dist
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.yml
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build React
        run: npm run build:react
      
      - name: Remove source maps
        run: find build -name "*.map" -delete && rm -rf build/node_modules
      
      - name: Build Electron
        run: npm run build:electron
      
      - name: Prune dev dependencies for package
        run: npm prune --omit=dev
      
      - name: Clean node_modules cache
        run: rm -rf node_modules/.cache
      
      - name: Package for macOS
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build React
        run: npm run build:react
      
      - name: Remove source maps
        run: find build -name "*.map" -delete && rm -rf build/node_modules
      
      - name: Build Electron
        run: npm run build:electron
      
      - name: Prune dev dependencies for package
        run: npm prune --omit=dev
      
      - name: Clean node_modules cache
        run: rm -rf node_modules/.cache
      
      - name: Package for Linux
        run: npm run dist
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-all-platforms:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create release summary
        run: |
          echo "✅ All platforms built successfully!"
          echo ""
          echo "**Windows**:"
          ls -la windows-build/ 2>/dev/null || echo "  No artifacts"
          echo ""
          echo "**macOS**:"
          ls -la macos-build/ 2>/dev/null || echo "  No artifacts"
          echo ""
          echo "**Linux**:"
          ls -la linux-build/ 2>/dev/null || echo "  No artifacts"
